spring.application.name=barangay-ease

# ==========================================
# DATABASE CONFIGURATION (Aiven Cloud MySQL)
# ==========================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==========================================
# SERVER
# ==========================================

server.port=${PORT:8080}

spring.thymeleaf.check-template-location=false
spring.mvc.static-path-pattern=/static/**

# ==========================================
# CORS
# ==========================================

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# ==========================================
# JWT
# ==========================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_SECONDS:28800}

# ==========================================
# FILE UPLOAD LIMITS
# ==========================================

app.upload.dir=${UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# ==========================================
# AI CONFIGURATION
# ==========================================

app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

app.gemini.connect-timeout-seconds=30
app.gemini.request-timeout-seconds=60

app.ai.cooldown-seconds=120

app.ai.chat-requests-per-minute=12
app.ai.classify-requests-per-minute=8

# ==========================================
# LOGGING
# ==========================================

logging.level.com.muntinlupa.barangay_ease.ai=INFO